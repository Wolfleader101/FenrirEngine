name: API descriptions

# Regenerates every committed API description (ADR-0042, tools/describe-api/README.md), every binding generated from
# them (packages/Iris/Tools/Iris.Bindings/README.md) and every type registration generated from them (ADR-0074,
# tools/generate-type-registry/README.md), and fails when that leaves the tree dirty: a header change was committed
# without its regenerated description, or a description without its regenerated binding or type registration. One
# runner (Windows: all three are the same bytes on every platform), on pull requests only, to spare the Actions budget.
# It also runs the binding generator's and the registry generator's own tests. Changes to docs and tickets alone run
# nothing.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".scratch/**"
      - ".githooks/**"
      - "scripts/check_tickets.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.x

jobs:
  describe:
    name: Descriptions, bindings and type registrations up to date
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      # Configuring is enough: fenrir-describe-api reads headers and natives' sources, fenrir-generate-bindings and
      # fenrir-generate-type-registry read descriptions, and none builds anything of the engine. Scripting is on because
      # Iris holds the binding generator. The renderer is on because FenrirWindow's and FenrirRenderer's descriptions,
      # bindings and type registrations are regenerated only with it on; SDL3 configures on this runner without a display.
      - name: Configure
        run: cmake -S . -B out/describe -DFENRIR_BUILD_EXAMPLES=OFF -DFENRIR_ENABLE_SCRIPTING=ON -DFENRIR_ENABLE_RENDERER=ON

      - name: Regenerate the descriptions
        run: cmake --build out/describe --target fenrir-describe-api --config Debug

      - name: Regenerate the bindings
        run: cmake --build out/describe --target fenrir-generate-bindings --config Debug

      - name: Regenerate the type registrations
        run: cmake --build out/describe --target fenrir-generate-type-registry --config Debug

      - name: Fail on a dirty tree
        shell: bash
        run: |
          git add --intent-to-add --all
          if ! git diff --exit-code; then
            echo "::error::The committed API descriptions, bindings or type registrations are stale. Run 'cmake --build <build-dir> --target fenrir-describe-api', then '--target fenrir-generate-bindings', then '--target fenrir-generate-type-registry' (README.md has the line), and commit the result."
            exit 1
          fi

      # After the check, so nothing the tests build can count as a change.
      - name: Test the binding generator
        run: dotnet test packages/Iris/Tools/Iris.Bindings/tests/Iris.Bindings.Tests.csproj --nologo

      - name: Test the registry generator
        run: dotnet test tools/generate-type-registry/tests/GenerateTypeRegistry.Tests.csproj --nologo
