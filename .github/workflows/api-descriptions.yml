name: API descriptions

# Regenerates every committed API description (ADR-0016, tools/describe-api/README.md) and fails when that leaves the
# tree dirty: a header change was committed without its regenerated description. Both runners, because a description
# is the same bytes on every platform.

on:
  pull_request:
  push:
    branches:
      - dotnet-scripting
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.x

jobs:
  describe:
    name: Descriptions up to date (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      # Configuring is enough: fenrir-describe-api reads headers and builds nothing of the engine.
      - name: Configure
        run: cmake -S . -B out/describe -DFENRIR_BUILD_EXAMPLES=OFF

      - name: Regenerate the descriptions
        run: cmake --build out/describe --target fenrir-describe-api --config Debug

      - name: Fail on a dirty tree
        shell: bash
        run: |
          git add --intent-to-add --all
          if ! git diff --exit-code; then
            echo "::error::The committed API descriptions are stale. Run 'cmake --build <build-dir> --target fenrir-describe-api' and commit the result."
            exit 1
          fi
