name: Build and test

# Builds the engine and runs its tests (README.md, "Building and testing") with every CMakePresets.json preset CI can run.
# The DemoApp is left out (FENRIR_BUILD_EXAMPLES=OFF): its third-party libraries in examples/DemoApp/libs are not submodules.

on:
  pull_request:
  push:
    branches:
      - dotnet-scripting
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Matches the projects' TargetFramework (net10.0); the repo has no global.json.
  DOTNET_VERSION: 10.0.x
  FENRIR_CMAKE_OPTIONS: -DFENRIR_ENABLE_SCRIPTING=ON -DFENRIR_ENABLE_PHYSICS=ON -DFENRIR_ENABLE_ASSETS=ON -DFENRIR_ENABLE_RENDERER=ON -DFENRIR_BUILD_TESTS=ON -DFENRIR_BUILD_EXAMPLES=OFF

jobs:
  windows:
    name: Windows (${{ matrix.preset }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Pull requests build one preset per compiler, a Debug and a Release; pushes to dotnet-scripting and main build all four.
      matrix:
        preset: ${{ fromJSON(github.event_name == 'pull_request' && '["clang-x64-debug", "msvc-x64-release"]' || '["clang-x64-debug", "clang-x64-release", "msvc-x64-debug", "msvc-x64-release"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      # The presets use Ninja with an external x64 architecture, so both clang and cl need the MSVC x64 environment.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Tool versions
        run: |
          cmake --version
          ninja --version
          dotnet --list-sdks
          if ("${{ matrix.preset }}".StartsWith("clang")) { clang++ --version }

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ env.FENRIR_CMAKE_OPTIONS }}

      - name: Build
        run: cmake --build out/build/${{ matrix.preset }}

      # The null tests only: the GL tests (label gl) need an OpenGL 4.6 core context, which the runner has no GPU for.
      - name: Test
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure -LE gl

  linux:
    name: Linux (${{ matrix.preset }})
    # The newest Ubuntu runner: its Mesa's llvmpipe gives the OpenGL 4.6 core context the GL tests need.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # xvfb-run's default screen is 8 bits deep, which has no visual for the GL tests' 8-bit-per-channel RGBA
      # backbuffer ("Couldn't find matching GLX visual"); a 24-bit screen has one.
      XVFB_SCREEN: -screen 0 1280x1024x24
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-debug
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      # Ninja, and the X11 and Wayland development packages SDL3's video needs (FenrirWindow). With no display on the
      # runner, FenrirWindow's window tests report skipped. Xvfb and Mesa's llvmpipe give the GL tests a display and an
      # OpenGL context, and glxinfo reports its version.
      - name: Install Ninja, SDL3's video dependencies and a virtual display
        run: |
          # The runners' own Mesa gives llvmpipe only OpenGL 4.5 core (26.04's Mesa 26.0.8 included), and the kisak-mesa
          # PPA does not yet publish Mesa for 26.04, so this job runs on 24.04 with the PPA's newer Mesa, whose llvmpipe
          # offers 4.6, as the spec allows. The Mesa drivers are named below so they upgrade from it.
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 libegl-mesa0
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            xvfb mesa-utils

      # The GL tests need OpenGL 4.6 core, which llvmpipe must offer itself: MESA_GL_VERSION_OVERRIDE is never set.
      - name: OpenGL version
        run: |
          xvfb-run -a -s "$XVFB_SCREEN" glxinfo -B | tee glxinfo.txt
          grep -q "core profile version string: 4\.6" glxinfo.txt || { echo "::error::llvmpipe does not offer OpenGL 4.6 core"; exit 1; }

      - name: Tool versions
        run: |
          cmake --version
          ninja --version
          clang++ --version
          dotnet --list-sdks

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ env.FENRIR_CMAKE_OPTIONS }}

      # -k 0: keep going after a failure, so one run reports every compile error.
      - name: Build
        run: cmake --build out/build/${{ matrix.preset }} -- -k 0

      - name: Test
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure -LE gl

      # The GL tests on llvmpipe, on a virtual display: verbose, so the log shows they ran. Without a 4.6 core device
      # they skip, which CTest counts as passing, so the step fails if they did.
      - name: GL tests
        run: |
          xvfb-run -a -s "$XVFB_SCREEN" ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure -L gl -V | tee gl-tests.txt
          if grep -q "no OpenGL 4.6 core device" gl-tests.txt; then echo "::error::the GL tests skipped"; exit 1; fi
