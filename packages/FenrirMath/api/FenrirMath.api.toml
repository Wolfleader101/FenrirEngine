# FenrirMath's selection (ADR-0042, tools/describe-api/README.md): the headers to read, relative to this file, and each
# type the package shares with bindings, with its role. Its vectors, quaternion and matrix are glm's, which every binding
# has its own of, so they are bound types: described by layout only. Its colour, ray and box are plain data, which the
# math binding (packages/FenrirScripting/api/FenrirMath.binding.toml) mirrors and every other binding names. Its frustum
# (ADR-0057) keeps its planes and their count private behind Planes(): described with that layout, so a binding's mirror
# holds the same bytes and gives them back through accessors of its own.
headers = ["../include/FenrirMath/Colour.hpp", "../include/FenrirMath/Math.hpp", "../include/FenrirMath/Frustum.hpp"]

private-members = ["Fenrir::Math::Frustum"]

[types]
"Fenrir::Colour" = "shared-struct"
"Fenrir::Math::Ray" = "shared-struct"
"Fenrir::Math::AABB" = "shared-struct"
"Fenrir::Math::Frustum" = "shared-struct"
"Fenrir::Math::Vec2" = "bound-type"
"Fenrir::Math::Vec3" = "bound-type"
"Fenrir::Math::Vec4" = "bound-type"
"Fenrir::Math::Quat" = "bound-type"
"Fenrir::Math::Mat4" = "bound-type"

# The order a bound type's components visit in, and files write them, when it is not storage order. glm stores the
# quaternion w first; the format's goldens, glTF and C#'s Quaternion write it x first.
[components]
"Fenrir::Math::Quat" = ["x", "y", "z", "w"]

# What tools/generate-type-registry writes for the package (ADR-0074): its types' descriptions, the function registering
# them, compiled into FenrirMath, and the test that their registered descriptions construct the defaults the description
# records.
[registration]
header = "../include/FenrirMath/Generated/FenrirMathTypes.hpp"
source = "../src/Generated/FenrirMathTypes.cpp"
test = "../Tests/Generated/FenrirMathTypesDefaultsTests.cpp"
function = "Fenrir::Generated::RegisterFenrirMathTypes"
includes = ["FenrirMath/Colour.hpp", "FenrirMath/Math.hpp", "FenrirMath/Frustum.hpp"]
