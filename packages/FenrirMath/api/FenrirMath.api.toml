# FenrirMath's selection (ADR-0042, tools/describe-api/README.md): the headers to read, relative to this file, and each
# type the package shares with bindings, with its role. Its vectors, quaternion and matrix are glm's, which every binding
# has its own of, so they are bound types: described by layout only. Its colour, ray and box are plain data, which the
# math binding (packages/FenrirScripting/api/FenrirMath.binding.toml) mirrors and every other binding names.
headers = ["../include/FenrirMath/Colour.hpp", "../include/FenrirMath/Math.hpp"]

[types]
"Fenrir::Colour" = "shared-struct"
"Fenrir::Math::Ray" = "shared-struct"
"Fenrir::Math::AABB" = "shared-struct"
"Fenrir::Math::Vec2" = "bound-type"
"Fenrir::Math::Vec3" = "bound-type"
"Fenrir::Math::Vec4" = "bound-type"
"Fenrir::Math::Quat" = "bound-type"
"Fenrir::Math::Mat4" = "bound-type"
