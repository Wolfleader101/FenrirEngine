# The fixture's binding: Fixture.api.json bound to C#. Paths are relative to this file. The generated files are committed
# beside the hand-written ones, and the tests compare a fresh run with them byte for byte.
namespace = "Fixture.Bindings"
# Spring is the Common binding's: named as Fixture.Common.Spring, not mirrored here.
uses = ["Uses/Common.binding.toml"]
# The Host SDK's names, stated once there; this file states only what is this binding's.
defaults = "Host.binding-defaults.toml"

[csharp]
contract = "Contract"
generated = "Contract/Generated"
pointer-type = "ulong"
readonly-events = true
# A struct C# reads and never writes: readonly, and so is Body's field holding it.
readonly-structs = ["Fixture::Limits"]
# A value C# never edits but assigns whole: readonly, while Body's field holding it stays writable.
immutable-structs = ["Fixture::Numbers"]
# Tag's id and owner are C#'s to reach through members a hand-written part would add, and its label a fixed buffer.
private-fields = ["Fixture::Tag::m_id", "Fixture::Tag::m_owner"]
fixed-buffers = ["Fixture::Tag::m_label"]
# Tag is the contract's own: internal, so the defaults test has no case for it.
internal-structs = ["Fixture::Tag"]

[cpp]
mappings = "Native/Generated/FixtureMappings.hpp"
includes = ["Fixture.hpp"]

# Never compiled here: Iris has no extension type. The names show the form a host's registration takes.
[registration]
source = "Native/Generated/FixtureRegistration.cpp"
function = "Fixture::Bindings::Register"
read-only = ["Fixture::Collider", "Fixture::Clock"]
# Registered by the extension itself: mirrored, mapped and tested, but not in the generated lists.
by-hand = ["Fixture::BodyId"]

[tests]
cpp = "Tests/Generated/FixtureDefaultsTests.cpp"
csharp = "Tests/Generated/FixtureDefaults.cs"
class = "Fixture.Bindings.Tests.Defaults"
setup = "const Fixture::DefaultsHarness harness;"
tags = "[bindings]"

# The native functions in Fixture.natives.json (a copy of tools/describe-api's, read from its Natives.cpp, whose
# sources and context these are). Their C# class needs the SDK's generator for its bodies, so only the SDK check
# compiles it.
[natives]
sources = ["Natives.cpp"]
class = "FixtureNative"
# The natives' declarations and Register's, beside the registration that includes it.
header = "Native/Generated/FixtureNatives.hpp"
types = { "Fixture::EntityId" = "Entity" }

# Vector3's defaults go through its constructor, Quaternion's set components by name, and Handle's own default is not
# all zero bytes (its id is all bits set), so it names the expression that makes it. Each names its mapping's header,
# written once into the mappings header. Ticket is the Host SDK's, in the defaults file.
[bound-types]
"Fixture::Vec3" = { type = "Vector3", constructor = ["x", "y", "z"], include = "BoundMappings.hpp" }
"Fixture::Quat" = { type = "Quaternion", include = "BoundMappings.hpp" }
"Fixture::Handle" = { type = "Handle", default = "new()", include = "BoundMappings.hpp" }
# Described by layout only, and held by nothing: their C# types are never named.
"Fixture::Size" = { type = "Size", include = "BoundMappings.hpp" }
"Fixture::Pair<double>" = { type = "DoublePair", include = "BoundMappings.hpp" }

# Exceptions to the PascalCase rule: one for a member of one type, one for every member of that name.
[names]
"Fixture::Limits::wideInfinity" = "DoubleInfinity"
"Fixture::Tag::m_id" = "id"
"Fixture::Tag::m_owner" = "owner"
"Fixture::Tag::m_label" = "Label"
"f64" = "Double"

[nouns]
"Fixture::Shape" = "shape"
