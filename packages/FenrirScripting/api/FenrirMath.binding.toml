# FenrirMath's C# binding (ADR-0043, packages/Iris/Tools/Iris.Bindings/README.md): FenrirMath's description bound to the
# Fenrir.Math contract. Its colour, ray and box are generated here; the glm types stay bound types, written by hand in the
# contract and mapped in FenrirScripting/BoundMappings.hpp. Every other binding names these mirrors through `uses`, so a
# math type has one C# type and one mapping. Paths are relative to this file. `cmake --build <dir> --target
# fenrir-generate-bindings` regenerates every output below; they are committed.
namespace = "Fenrir.Math"
# Named so the bindings that use this one can read them.
descriptions = ["../../FenrirMath/api/FenrirMath.api.json"]

[csharp]
contract = "../../FenrirMath/Managed/Fenrir.Math"
generated = "../../FenrirMath/Managed/Fenrir.Math/Generated"

[cpp]
mappings = "../include/FenrirScripting/Generated/FenrirMathMappings.hpp"
includes = ["FenrirMath/Colour.hpp", "FenrirMath/Math.hpp"]

# No registration: the built-in extension shares the Fenrir.Math assembly. The defaults test runs in the built-in
# binding's fixture.
[tests]
cpp = "../Tests/Generated/FenrirMathDefaultsTests.cpp"
csharp = "../Tests/Generated/FenrirMathDefaults.cs"
class = "Fenrir.ScriptFixture.MathDefaults"
includes = ["ScriptingApp.hpp", "ScriptingProbe.hpp"]
setup = "Fenrir::Testing::ScriptingApp app;"
component = "Fenrir::ScriptingProbe::Component(app.scripting)"
tags = "[scripting][bindings]"

# Every binding that uses this one inherits these (and the `using Fenrir.Math` a type holding one needs); their
# mappings are FenrirScripting's BoundMappings.hpp, included where they are bound.
[bound-types]
"Fenrir::Math::Vec2" = { type = "Vector2", constructor = ["x", "y"], include = "FenrirScripting/BoundMappings.hpp" }
"Fenrir::Math::Vec3" = { type = "Vector3", constructor = ["x", "y", "z"], include = "FenrirScripting/BoundMappings.hpp" }
"Fenrir::Math::Vec4" = { type = "Vector4", constructor = ["x", "y", "z", "w"], include = "FenrirScripting/BoundMappings.hpp" }
# glm stores w first; C#'s constructor takes it last.
"Fenrir::Math::Quat" = { type = "Quaternion", constructor = ["x", "y", "z", "w"], include = "FenrirScripting/BoundMappings.hpp" }
"Fenrir::Math::Mat4" = { type = "Matrix4x4", include = "FenrirScripting/BoundMappings.hpp" }

[names]
"Fenrir::Math::AABB" = "Bounds"
"Fenrir::Math::Ray::dir" = "Direction"
