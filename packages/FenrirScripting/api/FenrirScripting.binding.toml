# The built-in extension's C# binding (ADR-0042, packages/Iris/Tools/Iris.Bindings/README.md): FenrirECS's description
# bound to the Fenrir.Scripting contract and the extension every Scripting includes first. Paths are relative to this
# file. `cmake --build <dir> --target fenrir-generate-bindings` regenerates every output below; they are committed.
namespace = "Fenrir.Scripting"
# Named so the bindings that use this one (the extensions whose natives take the entity value) can read them.
descriptions = ["../../FenrirECS/api/FenrirECS.api.json", "FenrirScripting.api.json"]
# FenrirMath's types are the math binding's (ADR-0043): its mappings, which every extension's mappings reach through this
# binding's, are included here.
uses = ["FenrirMath.binding.toml"]
# The engine's components go by their C++ names, Fenrir.Transform and the rest, not the contract's namespace.
registered-namespace = "Fenrir"
# The scripting SDK's names are its defaults file's (FenrirScripting.binding-defaults.toml): this file states only what is this binding's.
defaults = "FenrirScripting.binding-defaults.toml"

[csharp]
contract = "../Managed/Fenrir.Scripting"
generated = "../Managed/Fenrir.Scripting/Generated"
# The engine keeps the hierarchy consistent, so C# only reads a Relationship.
readonly-structs = ["Fenrir::Relationship"]
# A link is a value C# holds and assigns whole but never edits: a mirror holding one keeps a writable field.
immutable-structs = ["Fenrir::Entity"]
# A link's value and entity list are the engine's: C# reads them through EntityLink's Target and IsNull.
private-fields = ["Fenrir::Entity::m_entityId", "Fenrir::Entity::m_entityList"]
fixed-buffers = ["Fenrir::Name::name"]

[cpp]
mappings = "../include/FenrirScripting/Generated/FenrirScriptingMappings.hpp"
includes = ["FenrirECS/DefaultComponents.hpp", "FenrirECS/Entity.hpp", "FenrirScripting/Errors.hpp"]

[registration]
source = "../src/Generated/FenrirScriptingRegistration.cpp"
function = "Fenrir::Generated::RegisterScripting"
read-only = ["Fenrir::Relationship"]

[tests]
cpp = "../Tests/Generated/FenrirScriptingDefaultsTests.cpp"
csharp = "../Tests/Generated/FenrirScriptingDefaults.cs"
class = "Fenrir.ScriptFixture.Defaults"
includes = ["FixtureApp.hpp"]
setup = "Fenrir::Testing::FixtureApp app;"
tags = "[scripting][bindings]"

[names]
"Fenrir::Entity" = "EntityLink"
"Fenrir::Entity::m_entityId" = "value"
"Fenrir::Entity::m_entityList" = "owner"
"Fenrir::Name::name" = "Text"
"Fenrir::Transform::pos" = "Position"
"Fenrir::Transform::rot" = "Rotation"

# The engine's native functions: tools/describe-api's natives mode reads every function in `sources` taking `context`
# first (with the EngineContext, the extension's state, second) into FenrirScripting.natives.json, and this binding
# generates from it their C# declarations, the Native class, and their registration.
[natives]
sources = ["../src/Bindings.cpp"]
class = "Native"
header = "../src/Generated/FenrirScriptingNatives.hpp"
includes = [
    # What the natives' declarations name: their extension state and the address alias, the engine's transform, and the
    # change error.
    "../EngineContext.hpp",
    "FenrirECS/DefaultComponents.hpp",
    "FenrirScripting/Errors.hpp",
]
# The addresses and counts natives write into C#'s memory are native-sized there.
types = { "Fenrir::Detail::NativeAddress" = "nuint" }
