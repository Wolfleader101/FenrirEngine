# FenrirScripting's own selection (ADR-0042, tools/describe-api/README.md): the error enums its built-in natives
# return, which no shared struct holds. The built-in binding (FenrirScripting.binding.toml) binds these beside
# FenrirECS's description, so C# switches on their names and no code is spelled by hand on either side.
headers = ["../include/FenrirScripting/Errors.hpp"]

[types]
"Fenrir::RegistryError" = "enum"
"Fenrir::ChangeError" = "enum"
