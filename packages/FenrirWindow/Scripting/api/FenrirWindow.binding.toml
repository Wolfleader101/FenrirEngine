# FenrirWindow's C# binding (ADR-0043, packages/Iris/Tools/Iris.Bindings/README.md): ../../api/FenrirWindow.api.json bound
# to the Fenrir.Window contract and Window::ScriptingExtension(). Paths are relative to this file. `cmake --build <dir>
# --target fenrir-generate-bindings` regenerates every output below; they are committed.
namespace = "Fenrir.Window"
# The window ids are FenrirInput's, and the math types the math binding's: named as theirs, never mirrored here.
uses = ["../../../FenrirInput/Scripting/api/FenrirInput.binding.toml", "../../../FenrirScripting/api/FenrirMath.binding.toml"]
# The scripting SDK's names are its defaults file's (FenrirScripting.binding-defaults.toml): this file states only what is this binding's.
defaults = "../../../FenrirScripting/api/FenrirScripting.binding-defaults.toml"

[csharp]
contract = "../../Managed/Fenrir.Window"
generated = "../../Managed/Fenrir.Window/Generated"
readonly-events = true

[cpp]
mappings = "../src/Generated/FenrirWindowMappings.hpp"
includes = ["FenrirWindow/WindowEvents.hpp", "FenrirWindow/WindowTypes.hpp"]

[registration]
source = "../src/Generated/FenrirWindowRegistration.cpp"
function = "Fenrir::Generated::RegisterWindow"

[tests]
cpp = "../Tests/Generated/FenrirWindowDefaultsTests.cpp"
csharp = "../Tests/Generated/FenrirWindowDefaults.cs"
class = "Fenrir.WindowScriptFixture.Defaults"
includes = ["WindowScriptingApp.hpp"]
setup = "WindowScriptingTests::WindowScriptingApp app;"
tags = "[window][scripting][bindings]"

# The native functions: tools/describe-api's natives mode reads every function in `sources` taking `context` first (with
# the WindowScripting state second) into FenrirWindow.natives.json, and this binding generates their C# declarations,
# WindowNative, and their registration.
[natives]
sources = ["../src/WindowScripting.cpp"]
class = "WindowNative"
header = "../src/Generated/FenrirWindowNatives.hpp"
includes = [
    # What the natives' declarations name: their extension state.
    "WindowScriptingState.hpp",
]
