# FenrirDebugDraw's C# binding (ADR-0043, packages/Iris/Tools/Iris.Bindings/README.md): this binding's own
# FenrirDebugDrawScripting.api.json bound to the Fenrir.DebugDraw contract and this extension. C# reaches debug drawing
# only through the DebugDraw facade over the natives declared here: the shape and text calls written by hand (the
# options the natives take are mirrored internal for it) and the group calls generated from the natives' @facade marks.
# Paths are relative to this file. `cmake --build <dir> --target fenrir-generate-bindings`
# regenerates every output below; they are committed.
namespace = "Fenrir.DebugDraw"
# FenrirMath's colour and box are the math binding's: named as Fenrir.Math's, never mirrored here.
uses = ["../../../FenrirScripting/api/FenrirMath.binding.toml"]
# The scripting SDK's names are its defaults file's (FenrirScripting.binding-defaults.toml): this file states only what is this binding's.
defaults = "../../../FenrirScripting/api/FenrirScripting.binding-defaults.toml"

[csharp]
contract = "../../Managed/Fenrir.DebugDraw"
generated = "../../Managed/Fenrir.DebugDraw/Generated"
# None of these is used: the contract has no components or events.
# The facade's: C# names ShapeOptions and TextOptions, with their group, and converts them to these.
internal-structs = ["Fenrir::ScriptOptions::ShapeOptions", "Fenrir::ScriptOptions::TextOptions"]

[cpp]
mappings = "../src/Generated/FenrirDebugDrawMappings.hpp"
# The options as C# passes them.
includes = ["FenrirDebugDraw/DebugDraw.hpp", "ScriptOptions.hpp"]

[registration]
source = "../src/Generated/FenrirDebugDrawRegistration.cpp"
function = "Fenrir::Generated::RegisterDebugDraw"
# Not registered at all: Iris checks a shared struct against a public C# struct only, and these are internal. Their
# layout is the description's on both sides (the C# mirror is generated from it, and the mappings assert C++'s size), and
# the extension's tests set every field from C# and read it back through what the call draws.
by-hand = ["Fenrir::ScriptOptions::ShapeOptions", "Fenrir::ScriptOptions::TextOptions"]

# No [tests]: the generated defaults test would have no case. The option structs are internal, so they get none (a public
# test method cannot return one).

[names]
"Fenrir::ScriptOptions::ShapeOptions" = "NativeShapeOptions"
"Fenrir::ScriptOptions::TextOptions" = "NativeTextOptions"

# The native functions behind DebugDraw: tools/describe-api's natives mode reads every function in `sources` taking
# `context` first (with the extension's state second) into FenrirDebugDraw.natives.json, and this binding generates from
# it their C# declarations, the DebugDrawNative class, and their registration.
[natives]
sources = ["../src/DebugDrawScripting.cpp"]
class = "DebugDrawNative"
header = "../src/Generated/FenrirDebugDrawNatives.hpp"
includes = [
    # What the natives' declarations name: their extension state and the options as C# passes them.
    "DebugDrawScriptingState.hpp",
    "ScriptOptions.hpp",
]
