# The debug draw binding's own selection (ADR-0042, tools/describe-api/README.md): the options its natives take by
# pointer in the form C# holds them, without the group, and the math types they take, which the math binding mirrors or
# every binding binds. FenrirDebugDraw's own headers select nothing: C# holds no component or resource of the package.
# DepthMode is described because the shape options hold it.
headers = ["../src/ScriptOptions.hpp"]

# The options hold the engine's Entity, which keeps its value and entity list private: described here as nested with the
# layout FenrirECS shares, and mirrored by the built-in binding.
private-members = ["Fenrir::Entity"]

[types]
"Fenrir::ScriptOptions::ShapeOptions" = "shared-struct"
"Fenrir::ScriptOptions::TextOptions" = "shared-struct"
# The math binding's (FenrirMath.api.toml gives them these roles).
"Fenrir::Colour" = "shared-struct"
"Fenrir::Math::AABB" = "shared-struct"

# The math binding's bound types, which every binding has its own of.
"Fenrir::Math::Vec2" = "bound-type"
"Fenrir::Math::Vec3" = "bound-type"
"Fenrir::Math::Quat" = "bound-type"
"Fenrir::Math::Mat4" = "bound-type"
