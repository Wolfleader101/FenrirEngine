# FenrirAnimation's C# binding (ADR-0039, ADR-0042, packages/Iris/Tools/Iris.Bindings/README.md):
# ../../api/FenrirAnimation.api.json bound to the Fenrir.Animation contract and Animation::ScriptingExtension(). Paths
# are relative to this file. `cmake --build <dir> --target fenrir-generate-bindings` regenerates every output below;
# they are committed.
namespace = "Fenrir.Animation"
# The engine's Entity is the built-in binding's, the asset handles and owner FenrirAssets's, PoseState FenrirSkeleton's:
# named as theirs, never mirrored here.
uses = [
    "../../../FenrirScripting/api/FenrirScripting.binding.toml",
    "../../../FenrirScripting/api/FenrirMath.binding.toml",
    "../../../FenrirAssets/Scripting/api/FenrirAssets.binding.toml",
    "../../../FenrirSkeleton/Scripting/api/FenrirSkeleton.binding.toml",
]
# The scripting SDK's names are its defaults file's (FenrirScripting.binding-defaults.toml): this file states only what is this binding's.
defaults = "../../../FenrirScripting/api/FenrirScripting.binding-defaults.toml"

[csharp]
contract = "../../Managed/Fenrir.Animation"
generated = "../../Managed/Fenrir.Animation/Generated"
readonly-events = true
# A clip event's name id is a value C# compares and assigns whole (ClipEventId.Of makes one).
immutable-structs = ["Fenrir::ClipEventId"]

[cpp]
mappings = "../src/Generated/FenrirAnimationMappings.hpp"
includes = [
    "FenrirAnimation/Animation.hpp",
    "FenrirAnimation/AnimationEvents.hpp",
    "FenrirAnimation/AnimationLayer.hpp",
    "FenrirAnimation/Animator.hpp",
    "FenrirAssets/BoneMaskData.hpp",
]

[registration]
source = "../src/Generated/FenrirAnimationRegistration.cpp"
function = "Fenrir::Generated::RegisterAnimation"
# Makes the extension from its state (ADR-0046): what the package's public function returns.
maker = "Fenrir::Generated::MakeAnimationExtension"

[tests]
cpp = "../Tests/Generated/FenrirAnimationDefaultsTests.cpp"
csharp = "../Tests/Generated/FenrirAnimationDefaults.cs"
class = "Fenrir.AnimationScriptFixture.Defaults"
includes = ["AnimationScriptingApp.hpp"]
setup = "Fenrir::Testing::AnimationScriptingApp app;"
tags = "[animation][scripting][bindings]"

# The native functions behind Animation, Clips and BoneMasks: tools/describe-api's natives mode reads every function in
# `sources` taking `context` first (with the extension's state second) into FenrirAnimation.natives.json, and this
# binding generates from it their C# declarations, the AnimationNative class, their registration, and from their
# @facade marks the generated parts of Animation, Clips and BoneMasks.
[natives]
sources = ["../src/AnimationScripting.cpp"]
class = "AnimationNative"
header = "../src/Generated/FenrirAnimationNatives.hpp"
includes = [
    # What the natives' declarations name: their extension state, the playback info and the assets' owner.
    "AnimationScriptingState.hpp",
    "FenrirAnimation/Animation.hpp",
    "FenrirAssets/AssetHandle.hpp",
    "FenrirAssets/BoneMaskData.hpp",
    "FenrirAssetsScripting/ScriptAssets.hpp",
]
