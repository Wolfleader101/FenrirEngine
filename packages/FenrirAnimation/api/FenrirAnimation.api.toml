# FenrirAnimation's selection (ADR-0042, tools/describe-api/README.md): the headers to read, relative to this file, and
# each type the package shares with bindings, with its role. The loop, layer, reference and fade enums are described
# because the components hold them, ClipEventId because the animation event does.
headers = [
    "../include/FenrirAnimation/Animator.hpp",
    "../include/FenrirAnimation/AnimationLayer.hpp",
    "../include/FenrirAnimation/AnimationEvents.hpp",
    "../include/FenrirAnimation/Animation.hpp",
    "../../FenrirAssets/include/FenrirAssets/BoneMaskData.hpp",
]

[types]
# The animation extension's components.
"Fenrir::Animator" = "component"
"Fenrir::AnimationLayer" = "component"

# Its events.
"Fenrir::AnimationEvent" = "event"
"Fenrir::ClipFinished" = "event"
"Fenrir::AnimationEventsDropped" = "event"

# The plain data its natives give by pointer.
"Fenrir::PlaybackInfo" = "shared-struct"

# Animation::Install's config, which a project file fills (ADR-0084).
"Fenrir::AnimationConfig" = "settings"

# Held by no shared type, but taken by the bone mask natives: FenrirAssets's, described all the same.
"Fenrir::MaskScope" = "enum"

# Types every binding has its own of.
"Fenrir::AssetHandle<Fenrir::Clip>" = "bound-type"
"Fenrir::AssetHandle<Fenrir::BoneMask>" = "bound-type"

# What tools/generate-type-registry writes for the package (ADR-0074): its types' descriptions, the function registering
# them, compiled into FenrirAnimation, and the test that their registered descriptions construct the defaults the
# description records. It uses the registrations of the packages registering the types it holds of theirs
# (FenrirAssets's clip and mask handles, and FenrirSkeleton's PoseState), which it points at rather than describing them
# again.
[registration]
header = "../include/FenrirAnimation/Generated/FenrirAnimationTypes.hpp"
source = "../src/Generated/FenrirAnimationTypes.cpp"
test = "../Tests/Generated/FenrirAnimationTypesDefaultsTests.cpp"
function = "Fenrir::Generated::RegisterFenrirAnimationTypes"
includes = [
    "FenrirAnimation/Animator.hpp",
    "FenrirAnimation/AnimationLayer.hpp",
    "FenrirAnimation/AnimationEvents.hpp",
    "FenrirAnimation/Animation.hpp",
    "FenrirAssets/BoneMaskData.hpp",
    "FenrirECS/TypeAttachments.hpp",
]
uses = ["../../FenrirAssets/api/FenrirAssets.api.toml", "../../FenrirSkeleton/api/FenrirSkeleton.api.toml"]
