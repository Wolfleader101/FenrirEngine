# The assets binding's own selection (ADR-0042, tools/describe-api/README.md): the plain data its natives take and give
# in C#'s form (ScriptAssets.hpp), the enums they take by value that no shared struct holds, and the types they take
# through pointers that FenrirAssets's description does not hold. The binding (FenrirAssets.binding.toml) binds these
# beside FenrirAssets's own.
headers = [
    "../include/FenrirAssetsScripting/ScriptAssets.hpp",
    "../../include/FenrirAssets/AssetHandle.hpp",
    "../../include/FenrirAssets/MaterialData.hpp",
    "../../../FenrirMath/include/FenrirMath/Colour.hpp",
]

[types]
"Fenrir::ScriptShaderParameter" = "shared-struct"
# Held by no field, but taken by the natives: described all the same.
"Fenrir::Detail::AssetKind" = "enum"
"Fenrir::ScriptAssetOwner" = "enum"
"Fenrir::BlendMode" = "enum"
# The math binding's, named through its `uses`: described here because a native takes one through a pointer.
"Fenrir::Colour" = "shared-struct"

"Fenrir::Math::Vec2" = "bound-type"
"Fenrir::Math::Vec3" = "bound-type"
"Fenrir::Math::Vec4" = "bound-type"
