# FenrirRagdoll's selection (ADR-0042, tools/describe-api/README.md): the headers to read, relative to this file, and
# each type the package shares with bindings, with its role. The modes and states are described because the components
# hold them. The description and the builder's result hold vectors and strings, so they stay C++'s (the ragdoll spec:
# C# reaches them through a native resource).
headers = [
    "../include/FenrirRagdoll/Components.hpp",
    "../include/FenrirRagdoll/Description.hpp",
]

# Ragdoll and RagdollBody hold the engine's Entity, which keeps its value and entity list private, and FenrirSkeleton's
# BoneName, which keeps its bytes private behind Set (ADR-0037): both described with the layout they share.
private-members = ["Fenrir::Entity", "Fenrir::BoneName"]

[types]
# The ragdoll extension's components.
"Fenrir::Ragdoll" = "component"
"Fenrir::RagdollBody" = "component"

# The plain data a native takes by pointer: the humanoid bone map DescribeHumanoid reads.
"Fenrir::HumanoidBones" = "shared-struct"

# Types every binding has its own of.
"Fenrir::Math::Vec3" = "bound-type"
"Fenrir::Math::Quat" = "bound-type"
