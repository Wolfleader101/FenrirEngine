# FenrirRenderer's selection (ADR-0042, tools/describe-api/README.md): the headers to read, relative to this file, and
# each type the package shares with bindings, with its role. Projection, RenderTarget, CameraBackground and Sky are tagged
# unions; their kinds, the Viewport and the tag enums are described through what holds them.
headers = [
    "../include/FenrirRenderer/Components.hpp",
    "../include/FenrirRenderer/Renderer.hpp",
    "../include/FenrirRenderer/WorldTargets2D.hpp",
]

# The frustum keeps its planes private, as FenrirMath.api.toml says: described with the layout it shares.
private-members = ["Fenrir::Math::Frustum"]

[types]
"Fenrir::MeshRenderer" = "component"
"Fenrir::InstancedMeshRenderer" = "component"
"Fenrir::Camera" = "component"
"Fenrir::DirectionalLight" = "component"
"Fenrir::PointLight" = "component"
"Fenrir::SpotLight" = "component"
"Fenrir::RectLight" = "component"
"Fenrir::SkinnedMesh" = "component"
# A quad in the world that 2D lists draw on: a script places one for a UI world root (UIRoot.CreateWorldRoot).
"Fenrir::WorldQuad2D" = "component"
"Fenrir::Sky" = "scene-resource"
"Fenrir::SkyLight" = "scene-resource"
"Fenrir::RendererStats" = "shared-struct"
# Renderer::Install's config, which a project file fills (ADR-0084).
"Fenrir::RendererConfig" = "settings"

# FenrirMath's ray, box and frustum, which the natives fill through pointers: selected with the math description's role,
# so this binding names them as the math binding's Ray, Bounds and Frustum (whose planes are private there too).
"Fenrir::Math::Ray" = "shared-struct"
"Fenrir::Math::AABB" = "shared-struct"
"Fenrir::Math::Frustum" = "shared-struct"

# Other packages' types the components hold: FenrirAssets's handles and FenrirMath's colour are those packages' (named by
# their bindings), FenrirInput's WindowId is described through WindowTarget.
"Fenrir::AssetHandle<Fenrir::Mesh>" = "bound-type"
"Fenrir::AssetHandle<Fenrir::Material>" = "bound-type"
"Fenrir::AssetHandle<Fenrir::Image>" = "bound-type"
"Fenrir::AssetHandle<Fenrir::InstanceList>" = "bound-type"
"Fenrir::Math::Vec2" = "bound-type"
"Fenrir::Math::Vec3" = "bound-type"
"Fenrir::Math::Vec4" = "bound-type"

# What tools/generate-type-registry writes for the package (ADR-0074): its types' descriptions, the function registering
# them, compiled into FenrirRenderer, and the test that their registered descriptions construct the defaults the
# description records. It uses the registrations of the packages registering the types it holds of theirs (FenrirMath's
# vectors, colour, ray, box and frustum, FenrirAssets's handles and FenrirInput's WindowId), which it points at rather
# than describing them again.
[registration]
header = "../include/FenrirRenderer/Generated/FenrirRendererTypes.hpp"
source = "../src/Generated/FenrirRendererTypes.cpp"
test = "../Tests/Generated/FenrirRendererTypesDefaultsTests.cpp"
function = "Fenrir::Generated::RegisterFenrirRendererTypes"
includes = [
    "FenrirRenderer/Components.hpp",
    "FenrirRenderer/Renderer.hpp",
    "FenrirRenderer/WorldTargets2D.hpp",
    "FenrirECS/TypeAttachments.hpp",
    "FenrirScene/Scene.hpp",
]
uses = [
    "../../FenrirMath/api/FenrirMath.api.toml",
    "../../FenrirAssets/api/FenrirAssets.api.toml",
    "../../FenrirInput/api/FenrirInput.api.toml",
]
