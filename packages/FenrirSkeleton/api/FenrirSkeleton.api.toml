# FenrirSkeleton's selection (ADR-0042, tools/describe-api/README.md): the headers to read, relative to this file, and
# each type the package shares with bindings, with its role. The timing, space and channel enums are described because
# the types below hold them; the rest are taken or returned by the natives.
headers = [
    "../include/FenrirSkeleton/SkeletonPose.hpp",
    "../include/FenrirSkeleton/BoneAttachment.hpp",
    "../include/FenrirSkeleton/PoseStages.hpp",
    "../../FenrirAssets/include/FenrirAssets/SkinningSource.hpp",
]

# BoneAttachment holds its BoneName, which keeps its bytes private behind Set (ADR-0037): described with the layout it
# shares, its bytes a fixed string.
private-members = ["Fenrir::BoneName"]

[types]
# The skeleton extension's components.
"Fenrir::SkeletonPose" = "component"
"Fenrir::BoneAttachment" = "component"

# The plain data its natives take or give by pointer.
"Fenrir::Target" = "shared-struct"

# Held by no shared type, but taken or returned by the natives: described all the same. PoseState is FenrirAssets's
# (the skinning source's), the one state every skeleton read reports.
"Fenrir::PoseState" = "enum"
"Fenrir::PoseKind" = "enum"
"Fenrir::AttachmentState" = "enum"
"Fenrir::DetachMode" = "enum"
"Fenrir::DetachResult" = "enum"
"Fenrir::OverrideScope" = "enum"

# Types every binding has its own of.
"Fenrir::AssetHandle<Fenrir::Skeleton>" = "bound-type"
"Fenrir::Math::Vec3" = "bound-type"
"Fenrir::Math::Quat" = "bound-type"

# What tools/generate-type-registry writes for the package (ADR-0074): its types' descriptions, the function registering
# them, compiled into FenrirSkeleton, and the test that their registered descriptions construct the defaults the
# description records. It uses the registrations of the packages registering the types it holds of theirs
# (FenrirAssets's skeleton handle, and FenrirECS's Transform (with FenrirMath's types through it)), which it points at
# rather than describing them again.
[registration]
header = "../include/FenrirSkeleton/Generated/FenrirSkeletonTypes.hpp"
source = "../src/Generated/FenrirSkeletonTypes.cpp"
test = "../Tests/Generated/FenrirSkeletonTypesDefaultsTests.cpp"
function = "Fenrir::Generated::RegisterFenrirSkeletonTypes"
includes = [
    "FenrirSkeleton/SkeletonPose.hpp",
    "FenrirSkeleton/BoneAttachment.hpp",
    "FenrirSkeleton/PoseStages.hpp",
    "FenrirAssets/SkinningSource.hpp",
    "FenrirECS/TypeAttachments.hpp",
]
uses = ["../../FenrirAssets/api/FenrirAssets.api.toml", "../../FenrirECS/api/FenrirECS.api.toml"]
