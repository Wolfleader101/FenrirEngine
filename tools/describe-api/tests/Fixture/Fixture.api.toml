# The fixture's selection: the headers to read, relative to this file, and each shared type's role.
headers = ["Fixture.hpp"]

# Types whose private data members are shared all the same.
private-members = ["Fixture::Tag"]

[types]
"Fixture::Body" = "component"
"Fixture::Collider" = "component"
"Fixture::Touched" = "event"
"Fixture::Hit" = "shared-struct"
"Fixture::Tag" = "shared-struct"
"Fixture::BodyId" = "shared-struct"
"Fixture::Weather" = "scene-resource"
"Fixture::Clock" = "app-resource"
"Fixture::Sky" = "app-resource"
"Fixture::Vec3" = "bound-type"
"Fixture::Quat" = "bound-type"
"Fixture::Handle" = "bound-type"
"Fixture::Size" = "bound-type"
# A specialisation named with its arguments, which no alias names and nothing instantiates.
"Fixture::Pair<double>" = "bound-type"
"Fixture::Ticket" = "bound-type"
